[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./deployments" }]

# Fork testing against the real ENSv2 beta on Sepolia. We deliberately do not
# vendor a local copy of the ENSv2 contracts: the beta is explicitly unfinished
# ("interfaces are not yet final"), so a vendored copy would silently drift from
# what is actually deployed. Testing against the live deployment means a breaking
# change upstream fails our tests instead of passing them.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
